date: '2026-09-13'
topic: company-case-design
observed_failure: >-
  提供された企業ロゴを共通の白枠に追加するだけで、ブランド色・文字階層・余白への展開が不足した。
  ユーザーからデザイン改善を求められ、再構成した。
invariant: >-
  企業ロゴの原本・縦横比を維持しながら、企業固有の色と情報階層を記事導線まで一貫して設計する。
  承認された原稿の句読点を、見出しの改行処理で追加・削除しない。
prevention:
  - ロゴ領域と本文領域の役割を分け、アクセント色・罫線・ボタンを揃える。
  - PCだけでなく狭い画面の改行・ロゴの切れ・リンク先の到達性まで確認する。
  - ローカル表示成功、全テスト成功、CI成功、本番公開を別の完了状態として記録する。
mechanical_check: npx playwright test tests/company-cases.spec.mjs
variants:
  - 390pxで企業カードから詳細記事へ進み、ロゴと本文を確認して一覧へ戻る。
  - 1440pxで同じ導線と既存記事のサイトマップ維持を確認する。
hookable: false
hook_reason: 視覚的なバランスと原資料との意味の一致は構文だけで判定できないため、ブラウザ検証と独立レビューを併用する。
successful_pattern: >-
  ロゴは白い領域に原本のまま置き、淡いブランド色を本文背景、濃いアクセントを罫線とリンクに展開する。
  意味の区切りで見出しを改行し、企業ごとの違いとカード全体の整列を両立する。
mobile_rendering_note: >-
  モバイルエミュレーションを使わず画面幅だけを変えた検証では検出できないブラウザ不具合がある。
  画像の原寸をHTML寸法に使ったケースでWebKit mobileの描画が高負荷になり、
  CSS表示枠相当の寸法属性へ置き換えることで対象テストが通過した。
  ロゴの縦横比はobject-fit:containで保ち、isMobile/hasTouchを有効にした導線テストも実施する。
